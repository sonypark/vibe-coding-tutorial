
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>김서연의 목표 페이지</title>

  <!-- ==================================
       D-day 설정: 여기 두 줄만 수정하세요!
       목표 날짜는 YYYY-MM-DD 형식입니다.
       ================================== -->
  <script>
    const TARGET_DATE = "2027-11-18";
    const TARGET_LABEL = "수능까지";
  </script>

  <style>
    /* 모든 요소의 크기를 쉽게 계산 */
    * {
      box-sizing: border-box;
    }

    /* 페이지 전체 */
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #e5f7fa, #dce9ff);
      color: #183c50;
      overflow-wrap: break-word;
    }

    /* =========================
       1. D-day 카드
       ========================= */
    .dday-card {
      width: 100%;
      max-width: 400px;
      padding: 26px 20px;
      border-radius: 24px;
      text-align: center;
      background: linear-gradient(135deg, #4eb7c5, #6ea8ff);
      color: #ffffff;
      box-shadow: 0 12px 30px rgba(78, 183, 197, 0.25);
    }

    .dday-number {
      margin: 0;
      font-size: clamp(48px, 12vw, 68px);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -2px;
    }

    .dday-label {
      margin: 10px 0 0;
      font-size: 15px;
      font-weight: 600;
    }

    /* =========================
       2. 자기소개 카드
       ========================= */
    .profile-card {
      width: 100%;
      max-width: 400px;
      padding: 36px 24px;
      background: #ffffff;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(38, 87, 110, 0.12);
    }

    .emoji {
      font-size: 76px;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .profile-card h1 {
      margin: 0 0 12px;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .introduction {
      margin: 0;
      color: #647987;
      font-size: 15px;
      line-height: 1.8;
      word-break: keep-all;
    }

    /* 좋아하는 것 */
    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 28px 0;
    }

    .tag {
      padding: 10px 14px;
      border-radius: 999px;
      background: #e6f5f7;
      color: #286779;
      font-size: 14px;
      font-weight: 600;
    }

    /* 깃허브 버튼 */
    .github-button {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 14px;
      background: #176b87;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: background 0.2s, transform 0.2s;
    }

    .github-button:hover {
      background: #10536b;
      transform: translateY(-2px);
    }

    .github-button:focus-visible {
      outline: 3px solid #8acfe0;
      outline-offset: 4px;
    }

    /* =========================
       3. 만다라트 목표판
       ========================= */
    .mandart {
      width: 100%;
      max-width: 600px;
      padding: 24px 12px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 12px 35px rgba(38, 87, 110, 0.10);
      color: #183c50;
    }

    .mandart-title {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
      font-weight: 800;
    }

    .mandart-guide {
      margin: 0 0 20px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      color: #647987;
    }

    /* 정사각형 3×3 격자 */
    .mandart-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      width: 100%;
    }

    .mandart-cell {
      min-width: 0;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      border: 2px solid #d6e8ee;
      border-radius: 12px;
      background: #ffffff;
      color: #28546a;
      text-align: center;
      font-size: clamp(11px, 2.8vw, 15px);
      line-height: 1.45;
      overflow-wrap: anywhere;
      word-break: normal;
      cursor: text;
      user-select: text;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .mandart-cell:focus {
      outline: none;
      border-color: #2386a5;
      box-shadow: 0 0 0 2px rgba(35, 134, 165, 0.15);
    }

    /* 가운데 큰 목표만 다른 색상 */
    .mandart-center {
      background: #176b87;
      border-color: #176b87;
      color: #ffffff;
      font-weight: 800;
    }

    .mandart-center:focus {
      border-color: #78d5e7;
      box-shadow: 0 0 0 3px rgba(120, 213, 231, 0.35);
    }

    /* 저장 안내 */
    .mandart-save-note {
      margin: 14px 0 0;
      text-align: center;
      color: #647987;
      font-size: 12px;
    }

    /* =========================
       작은 휴대폰 화면
       ========================= */
    @media (max-width: 360px) {
      body {
        padding: 20px 10px;
        gap: 16px;
      }

      .profile-card {
        padding: 28px 18px;
      }

      .emoji {
        font-size: 64px;
      }

      .profile-card h1 {
        font-size: 26px;
      }

      .dday-card {
        padding: 24px 16px;
      }

      .mandart {
        padding: 20px 8px;
      }

      .mandart-grid {
        gap: 4px;
      }

      .mandart-cell {
        padding: 3px;
        border-radius: 8px;
        border-width: 1px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       1. D-day 카운터
       ========================= -->
  <section class="dday-card" aria-label="D-day 카운터">
    <p class="dday-number" id="dday">계산 중...</p>
    <p class="dday-label" id="dday-label">수능까지</p>
  </section>

  <!-- =========================
       2. 자기소개 카드
       ========================= -->
  <main class="profile-card">
    <div class="emoji" aria-label="파도">🌊</div>

    <h1>김서연</h1>

    <p class="introduction">
      바다랑 코딩을 좋아하는 고등학교 2학년입니다
    </p>

    <div class="tags" aria-label="좋아하는 것">
      <span class="tag">🏀 농구</span>
      <span class="tag">🎧 뉴진스</span>
      <span class="tag">🐬 해양생물</span>
    </div>

    <a
      class="github-button"
      href="https://github.com/"
      target="_blank"
      rel="noopener noreferrer"
    >
      내 깃허브 ↗
    </a>
  </main>

  <!-- =========================
       3. 만다라트 목표판
       ========================= -->
  <section class="mandart">
    <h2 class="mandart-title">나의 목표</h2>
    <p class="mandart-guide">
      칸을 눌러서 고칠 수 있어요 ✏️
    </p>

    <div class="mandart-grid" id="mandartGrid">
      <div class="mandart-cell">매일 30분 영어 듣기</div>
      <div class="mandart-cell">수학 오답노트</div>
      <div class="mandart-cell">주 3회 운동</div>

      <div class="mandart-cell">독서 월 2권</div>
      <div class="mandart-cell mandart-center">해양생물학과 진학</div>
      <div class="mandart-cell">과학 동아리 발표</div>

      <div class="mandart-cell">7시간 수면</div>
      <div class="mandart-cell">봉사활동 20시간</div>
      <div class="mandart-cell">코딩 포트폴리오</div>
    </div>

    <p class="mandart-save-note">
      수정한 내용은 자동으로 저장됩니다.
    </p>
  </section>

  <!-- =========================
       4. D-day 자동 계산
       ========================= -->
  <script>
    const ddayElement = document.getElementById("dday");
    const labelElement = document.getElementById("dday-label");

    labelElement.textContent = TARGET_LABEL;

    // 오늘 날짜를 자정 기준으로 계산
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    // 목표 날짜
    const target = new Date(TARGET_DATE + "T00:00:00");

    if (Number.isNaN(target.getTime())) {
      ddayElement.textContent = "날짜 오류";
    } else {
      const difference = Math.round(
        (target.getTime() - today.getTime()) /
        (1000 * 60 * 60 * 24)
      );

      if (difference > 0) {
        ddayElement.textContent = "D-" + difference;
      } else if (difference === 0) {
        ddayElement.textContent = "D-DAY";
      } else {
        ddayElement.textContent = "D+" + Math.abs(difference);
      }
    }

    // =========================
    // 5. 만다라트 자동 저장 기능
    // =========================
    (() => {
      const grid = document.getElementById("mandartGrid");
      const cells = Array.from(
        grid.querySelectorAll(".mandart-cell")
      );

      // 저장소 이름: 다른 페이지의 데이터와 구분
      const STORAGE_KEY = "seoyeonMandartGoals";

      // 수정한 목표 저장
      function saveGoals() {
        try {
          const goals = cells.map(cell => cell.innerText.trim());
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(goals)
          );
        } catch (error) {
          console.warn("목표를 저장하지 못했습니다.", error);
        }
      }

      // 기존에 저장한 목표 불러오기
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
          const goals = JSON.parse(saved);

          if (
            Array.isArray(goals) &&
            goals.length === cells.length &&
            goals.every(goal => typeof goal === "string")
          ) {
            cells.forEach((cell, index) => {
              cell.textContent = goals[index];
            });
          }
        }
      } catch (error) {
        console.warn("저장된 목표를 불러오지 못했습니다.", error);
      }

      // 칸을 눌러 직접 수정할 수 있도록 설정
      cells.forEach(cell => {
        cell.contentEditable = "true";
        cell.setAttribute("role", "textbox");
        cell.setAttribute("aria-multiline", "false");
        cell.setAttribute("spellcheck", "false");

        // 글자가 바뀔 때마다 자동 저장
        cell.addEventListener("input", saveGoals);

        // Enter 키로 줄바꿈하지 않고 편집 종료
        cell.addEventListener("keydown", event => {
          if (event.key === "Enter") {
            event.preventDefault();
            cell.blur();
          }
        });

        // 수정 완료 시에도 저장
        cell.addEventListener("blur", saveGoals);
      });
    })();
  </script>

</body>
</html>
