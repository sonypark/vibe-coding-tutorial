
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 휴대폰 화면에 맞게 표시 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>같은 그림 찾기 게임</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #eaf3ff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game {
      width: 100%;
      max-width: 430px;
      padding: 25px 18px;
      background: white;
      border-radius: 25px;
      box-shadow: 0 8px 25px #00000015;
      text-align: center;
    }

    h1 {
      margin: 5px 0 10px;
      color: #34547a;
      font-size: 27px;
    }

    .description {
      color: #888;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* 점수와 시간 */
    .score-board {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .info {
      flex: 1;
      padding: 13px 5px;
      background: #edf4ff;
      border-radius: 15px;
    }

    .info p {
      margin: 0 0 5px;
      color: #6682a5;
      font-size: 13px;
    }

    .info strong {
      color: #34547a;
      font-size: 24px;
    }

    /* 4x4 카드 배치 */
    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 20px 0;
    }

    /* 카드 바깥 */
    .card {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: none;
      background: transparent;
      padding: 0;
      perspective: 600px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* 카드 회전 */
    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.45s;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    /* 카드 앞면과 뒷면 */
    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      user-select: none;
    }

    /* 카드 뒷면 */
    .card-front {
      background: #75a9ed;
      color: white;
      font-size: clamp(22px, 7vw, 38px);
      box-shadow: 0 4px 0 #4e80c0;
    }

    /* 카드 앞면 */
    .card-back {
      background: #fff1d9;
      border: 2px solid #f4d49f;
      transform: rotateY(180deg);
      font-size: clamp(25px, 8vw, 43px);
    }

    /* 짝을 맞춘 카드 */
    .card.matched .card-back {
      background: #d8f6e4;
      border-color: #8bd4a7;
    }

    .card:disabled {
      cursor: default;
    }

    /* 게임 시작 버튼 */
    .start-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 15px;
      background: #548ee0;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .start-btn:active {
      background: #3674c7;
    }

    .message {
      min-height: 30px;
      margin: 15px 0 5px;
      color: #45658b;
      font-size: 16px;
      font-weight: bold;
    }

    .tip {
      margin-top: 12px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="game">

    <h1>🧠 같은 그림 찾기!</h1>

    <div class="description">
      카드를 두 장씩 뒤집어 같은 그림을 찾아보세요!
    </div>

    <!-- 점수판 -->
    <div class="score-board">

      <div class="info">
        <p>🔄 뒤집은 횟수</p>
        <strong id="moves">0</strong>
      </div>

      <div class="info">
        <p>⏱️ 걸린 시간</p>
        <strong id="time">0초</strong>
      </div>

      <div class="info">
        <p>⭐ 찾은 짝</p>
        <strong id="pairs">0/8</strong>
      </div>

    </div>

    <!-- 카드가 들어갈 게임판 -->
    <div class="board" id="board"></div>

    <button class="start-btn" id="startBtn">
      🎮 게임 시작!
    </button>

    <div class="message" id="message">
      시작 버튼을 눌러주세요!
    </div>

    <div class="tip">
      💡 같은 그림 8쌍을 모두 찾아보세요!
    </div>

  </div>

  <script>

    // 사용할 그림 8종류
    const pictures = [
      "🐶", "🐱", "🐰", "🐼",
      "🦊", "🐸", "🐵", "🐻"
    ];

    // HTML 요소 가져오기
    const board = document.getElementById("board");
    const movesText = document.getElementById("moves");
    const timeText = document.getElementById("time");
    const pairsText = document.getElementById("pairs");
    const message = document.getElementById("message");
    const startBtn = document.getElementById("startBtn");

    // 게임 변수
    let cards = [];
    let firstCard = null;
    let secondCard = null;

    let moves = 0;
    let matchedPairs = 0;
    let seconds = 0;

    let playing = false;
    let locked = false;

    let timer = null;
    let checkTimer = null;

    // 카드 섞기
    function shuffle(array) {

      for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];

      }

      return array;
    }

    // 게임판 만들기
    function createBoard() {

      board.innerHTML = "";

      // 그림을 두 개씩 복사해서 총 16장 만들기
      cards = shuffle([...pictures, ...pictures]);

      cards.forEach((picture, index) => {

        const card = document.createElement("button");

        card.className = "card";
        card.type = "button";
        card.setAttribute("aria-label", "카드 " + (index + 1));

        card.innerHTML = `
          <div class="card-inner">

            <div class="card-front">
              ?
            </div>

            <div class="card-back">
              ${picture}
            </div>

          </div>
        `;

        // 카드 클릭 이벤트
        card.addEventListener("click", () => {

          flipCard(card, picture);

        });

        board.appendChild(card);

      });

    }

    // 카드 뒤집기
    function flipCard(card, picture) {

      // 게임 중이 아니거나 카드가 열려 있으면 무시
      if (!playing) return;
      if (locked) return;
      if (card.classList.contains("flipped")) return;
      if (card.classList.contains("matched")) return;

      // 첫 번째 카드를 누른 순간 타이머 시작
      if (moves === 0 && firstCard === null) {
        startTimer();
      }

      // 카드 뒤집기
      card.classList.add("flipped");

      // 첫 번째 카드
      if (firstCard === null) {

        firstCard = {
          element: card,
          picture: picture
        };

        return;
      }

      // 두 번째 카드
      secondCard = {
        element: card,
        picture: picture
      };

      // 두 장을 선택했으므로 횟수 증가
      moves++;
      movesText.textContent = moves;

      // 두 그림이 같은지 확인
      checkMatch();

    }

    // 두 카드 비교
    function checkMatch() {

      // 두 그림이 같은 경우
      if (firstCard.picture === secondCard.picture) {

        firstCard.element.classList.add("matched");
        secondCard.element.classList.add("matched");

        matchedPairs++;

        pairsText.textContent = matchedPairs + "/8";

        message.textContent = "🎉 정답이에요!";

        // 선택한 카드 초기화
        firstCard = null;
        secondCard = null;

        // 8쌍을 모두 찾았는지 확인
        if (matchedPairs === 8) {
          endGame();
        }

      }

      // 두 그림이 다른 경우
      else {

        locked = true;

        message.textContent = "아쉽네요! 다시 도전해보세요.";

        // 잠시 보여준 뒤 카드 덮기
        checkTimer = setTimeout(() => {

          firstCard.element.classList.remove("flipped");
          secondCard.element.classList.remove("flipped");

          firstCard = null;
          secondCard = null;

          locked = false;

          message.textContent = "다른 그림을 찾아보세요!";

        }, 850);

      }

    }

    // 시간 측정 시작
    function startTimer() {

      if (timer !== null) return;

      timer = setInterval(() => {

        seconds++;

        timeText.textContent = seconds + "초";

      }, 1000);

    }

    // 게임 종료
    function endGame() {

      playing = false;

      clearInterval(timer);
      timer = null;

      clearTimeout(checkTimer);
      checkTimer = null;

      message.textContent =
        "🏆 성공! " + moves + "번 만에 " +
        seconds + "초 만에 모두 찾았어요!";

      startBtn.textContent = "🔄 다시 하기";

    }

    // 게임 시작 또는 다시 시작
    function startGame() {

      // 기존 타이머 정리
      clearInterval(timer);
      clearTimeout(checkTimer);

      timer = null;
      checkTimer = null;

      // 변수 초기화
      moves = 0;
      matchedPairs = 0;
      seconds = 0;

      firstCard = null;
      secondCard = null;

      playing = true;
      locked = false;

      // 화면 초기화
      movesText.textContent = "0";
      timeText.textContent = "0초";
      pairsText.textContent = "0/8";

      message.textContent = "같은 그림을 찾아보세요!";

      startBtn.textContent = "게임 진행 중...";

      // 새로운 게임판 만들기
      createBoard();

    }

    // 시작 버튼
    startBtn.addEventListener("click", () => {

      startGame();

    });

    // 처음 화면에도 카드 배치
    createBoard();

  </script>

</body>
</html>
