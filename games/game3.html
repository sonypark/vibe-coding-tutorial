
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>운석 피하기 게임</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080d20;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>

<body>

<canvas id="game"></canvas>

<script>
  // =====================================
  // 1. 캔버스 설정
  // =====================================

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  let W = 0;
  let H = 0;

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 우주선이 화면 밖으로 나가지 않도록 위치 조정
    ship.x = Math.max(
      ship.width / 2,
      Math.min(W - ship.width / 2, ship.x)
    );

    ship.y = H - 100;
  }

  // =====================================
  // 2. 게임 변수
  // =====================================

  let gameState = "ready";

  let score = 0;
  let bestScore = Number(localStorage.getItem("meteorBest")) || 0;

  let startTime = 0;
  let elapsed = 0;

  let meteors = [];
  let stars = [];

  let spawnTimer = 0;
  let lastTime = 0;

  // 우주선 정보
  const ship = {
    x: window.innerWidth / 2,
    y: window.innerHeight - 100,
    width: 46,
    height: 55,
    speed: 420
  };

  // 키보드 상태
  const keys = {
    left: false,
    right: false
  };

  // =====================================
  // 3. 별 배경 만들기
  // =====================================

  function createStars() {
    stars = [];

    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 35 + 15
      });
    }
  }

  // =====================================
  // 4. 운석 만들기
  // =====================================

  function createMeteor() {

    const size = Math.random() * 18 + 17;

    meteors.push({
      x: Math.random() * (W - size * 2) + size,
      y: -size,
      size: size,

      // 운석마다 속도와 회전 방향이 다름
      speed: Math.random() * 100 + 160,
      rotation: Math.random() * Math.PI * 2,
      rotateSpeed: (Math.random() - 0.5) * 3
    });

  }

  // =====================================
  // 5. 게임 초기화
  // =====================================

  function startGame() {

    score = 0;
    elapsed = 0;

    meteors = [];
    spawnTimer = 0;

    ship.x = W / 2;
    ship.y = H - 100;

    startTime = performance.now();
    lastTime = startTime;

    gameState = "playing";
  }

  // =====================================
  // 6. 게임 오버
  // =====================================

  function gameOver() {

    gameState = "over";

    if (score > bestScore) {
      bestScore = score;

      localStorage.setItem(
        "meteorBest",
        bestScore
      );
    }

  }

  // =====================================
  // 7. 키보드 조작
  // =====================================

  window.addEventListener("keydown", (e) => {

    if (
      ["ArrowLeft", "ArrowRight", " "].includes(e.key)
    ) {
      e.preventDefault();
    }

    if (e.key === "ArrowLeft") {
      keys.left = true;
    }

    if (e.key === "ArrowRight") {
      keys.right = true;
    }

    // 스페이스바로 시작 또는 재시작
    if (
      e.code === "Space" &&
      gameState !== "playing"
    ) {
      startGame();
    }

  });

  window.addEventListener("keyup", (e) => {

    if (e.key === "ArrowLeft") {
      keys.left = false;
    }

    if (e.key === "ArrowRight") {
      keys.right = false;
    }

  });

  window.addEventListener("blur", () => {
    keys.left = false;
    keys.right = false;
  });

  // =====================================
  // 8. 휴대폰 터치 조작
  // =====================================

  let dragging = false;

  function moveShip(clientX) {

    ship.x = Math.max(
      ship.width / 2,
      Math.min(W - ship.width / 2, clientX)
    );

  }

  canvas.addEventListener("pointerdown", (e) => {

    if (gameState !== "playing") {
      startGame();
      return;
    }

    dragging = true;

    moveShip(e.clientX);

  });

  canvas.addEventListener("pointermove", (e) => {

    if (dragging && gameState === "playing") {
      moveShip(e.clientX);
    }

  });

  canvas.addEventListener("pointerup", () => {
    dragging = false;
  });

  canvas.addEventListener("pointercancel", () => {
    dragging = false;
  });

  // =====================================
  // 9. 별 움직이기
  // =====================================

  function updateStars(delta) {

    stars.forEach(star => {

      star.y += star.speed * delta;

      if (star.y > H) {
        star.y = 0;
        star.x = Math.random() * W;
      }

    });

  }

  // =====================================
  // 10. 우주선 움직이기
  // =====================================

  function updateShip(delta) {

    if (dragging) return;

    if (keys.left) {
      ship.x -= ship.speed * delta;
    }

    if (keys.right) {
      ship.x += ship.speed * delta;
    }

    // 화면 밖으로 나가지 못하게 제한
    ship.x = Math.max(
      ship.width / 2,
      Math.min(W - ship.width / 2, ship.x)
    );

  }

  // =====================================
  // 11. 운석 움직이기
  // =====================================

  function updateMeteors(delta) {

    // 시간이 지날수록 운석이 자주 등장
    const spawnInterval = Math.max(
      0.22,
      0.85 - elapsed * 0.012
    );

    spawnTimer += delta;

    if (spawnTimer >= spawnInterval) {

      spawnTimer = 0;

      createMeteor();

      // 시간이 지날수록 추가 운석 등장 확률 증가
      if (elapsed > 15 && Math.random() < 0.25) {
        createMeteor();
      }

      if (elapsed > 35 && Math.random() < 0.35) {
        createMeteor();
      }

    }

    // 운석 이동
    meteors.forEach(meteor => {

      meteor.y += (meteor.speed + elapsed * 5) * delta;

      meteor.rotation += meteor.rotateSpeed * delta;

    });

    // 화면 아래로 사라진 운석 제거
    meteors = meteors.filter(
      meteor => meteor.y < H + meteor.size
    );

  }

  // =====================================
  // 12. 충돌 확인
  // =====================================

  function checkCollision() {

    // 우주선을 원형으로 간단히 판정
    const shipRadius = 19;

    for (const meteor of meteors) {

      const dx = ship.x - meteor.x;
      const dy = (ship.y - 5) - meteor.y;

      const distance = Math.sqrt(
        dx * dx + dy * dy
      );

      if (distance < shipRadius + meteor.size * 0.75) {

        gameOver();
        return;

      }

    }

  }

  // =====================================
  // 13. 게임 업데이트
  // =====================================

  function update(delta) {

    updateStars(delta);

    if (gameState !== "playing") return;

    elapsed = (performance.now() - startTime) / 1000;

    score = Math.floor(elapsed);

    updateShip(delta);
    updateMeteors(delta);

    checkCollision();

  }

  // =====================================
  // 14. 별 그리기
  // =====================================

  function drawStars() {

    ctx.fillStyle = "white";

    stars.forEach(star => {

      ctx.globalAlpha = 0.4 + Math.random() * 0.5;

      ctx.beginPath();

      ctx.arc(
        star.x,
        star.y,
        star.size,
        0,
        Math.PI * 2
      );

      ctx.fill();

    });

    ctx.globalAlpha = 1;

  }

  // =====================================
  // 15. 우주선 그리기
  // =====================================

  function drawShip() {

    ctx.save();

    ctx.translate(ship.x, ship.y);

    // 엔진 불꽃
    ctx.fillStyle = "#ff9f43";

    ctx.beginPath();
    ctx.moveTo(-10, 18);
    ctx.lineTo(0, 43 + Math.random() * 8);
    ctx.lineTo(10, 18);
    ctx.fill();

    // 우주선 몸체
    ctx.fillStyle = "#dce9ff";

    ctx.beginPath();
    ctx.moveTo(0, -28);
    ctx.lineTo(23, 22);
    ctx.lineTo(0, 14);
    ctx.lineTo(-23, 22);
    ctx.closePath();
    ctx.fill();

    // 우주선 날개
    ctx.fillStyle = "#5d9be8";

    ctx.beginPath();
    ctx.moveTo(-12, 5);
    ctx.lineTo(-29, 24);
    ctx.lineTo(-12, 20);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(12, 5);
    ctx.lineTo(29, 24);
    ctx.lineTo(12, 20);
    ctx.fill();

    // 조종석
    ctx.fillStyle = "#57d9f5";

    ctx.beginPath();
    ctx.ellipse(0, -8, 7, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

  }

  // =====================================
  // 16. 운석 그리기
  // =====================================

  function drawMeteors() {

    meteors.forEach(meteor => {

      ctx.save();

      ctx.translate(meteor.x, meteor.y);
      ctx.rotate(meteor.rotation);

      // 운석 몸체
      ctx.fillStyle = "#a66d52";

      ctx.beginPath();

      const points = 9;

      for (let i = 0; i < points; i++) {

        const angle = (i / points) * Math.PI * 2;

        const radius = meteor.size *
          (0.8 + Math.sin(i * 12) * 0.12);

        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }

      }

      ctx.closePath();
      ctx.fill();

      // 운석 표면 무늬
      ctx.fillStyle = "#704638";

      ctx.beginPath();
      ctx.arc(-meteor.size * 0.25, -meteor.size * 0.15,
        meteor.size * 0.18, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(meteor.size * 0.3, meteor.size * 0.25,
        meteor.size * 0.12, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

    });

  }

  // =====================================
  // 17. 점수판 그리기
  // =====================================

  function drawScore() {

    ctx.fillStyle = "white";
    ctx.textAlign = "left";

    ctx.font = "bold 20px Arial";
    ctx.fillText("⭐ " + score + "초", 20, 40);

    ctx.font = "14px Arial";
    ctx.fillStyle = "#aab8d9";

    ctx.fillText("최고 기록: " + bestScore + "초", 20, 65);

  }

  // =====================================
  // 18. 시작 화면 / 게임 오버 화면
  // =====================================

  function drawOverlay() {

    if (gameState === "playing") return;

    ctx.fillStyle = "rgba(3, 8, 25, 0.78)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";

    if (gameState === "ready") {

      ctx.fillStyle = "white";
      ctx.font = "bold 34px Arial";
      ctx.fillText("🚀 운석 피하기", W / 2, H * 0.36);

      ctx.font = "18px Arial";
      ctx.fillStyle = "#c9d9ff";
      ctx.fillText("우주선을 움직여 운석을 피하세요!", W / 2, H * 0.43);

      ctx.font = "16px Arial";
      ctx.fillText("👆 손가락으로 드래그해서 이동", W / 2, H * 0.51);
      ctx.fillText("⌨️ PC에서는 ← → 방향키", W / 2, H * 0.56);

      drawButton("화면을 터치해서 시작!", H * 0.68);

    }

    if (gameState === "over") {

      ctx.fillStyle = "#ff7777";
      ctx.font = "bold 38px Arial";
      ctx.fillText("GAME OVER", W / 2, H * 0.35);

      ctx.fillStyle = "white";
      ctx.font = "bold 25px Arial";
      ctx.fillText("생존 시간: " + score + "초", W / 2, H * 0.44);

      ctx.font = "18px Arial";
      ctx.fillStyle = "#ffd76b";
      ctx.fillText("🏆 최고 기록: " + bestScore + "초", W / 2, H * 0.51);

      drawButton("다시 도전하기!", H * 0.65);

    }

  }

  // 버튼 그리기
  function drawButton(text, y) {

    const buttonWidth = Math.min(W - 50, 290);
    const buttonHeight = 55;
    const x = (W - buttonWidth) / 2;

    ctx.fillStyle = "#438ee9";

    ctx.beginPath();
    ctx.roundRect(x, y, buttonWidth, buttonHeight, 15);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.font = "bold 19px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
      text,
      W / 2,
      y + 35
    );

  }

  // =====================================
  // 19. 화면 그리기
  // =====================================

  function draw() {

    // 배경
    ctx.fillStyle = "#080d20";
    ctx.fillRect(0, 0, W, H);

    drawStars();

    drawMeteors();
    drawShip();

    drawScore();

    drawOverlay();

  }

  // =====================================
  // 20. 게임 반복 실행
  // =====================================

  function gameLoop(timestamp) {

    // 프레임 사이의 시간 계산
    let delta = (timestamp - lastTime) / 1000;

    // 너무 큰 시간 차이 방지
    delta = Math.min(delta, 0.04);

    lastTime = timestamp;

    update(delta);
    draw();

    requestAnimationFrame(gameLoop);

  }

  // =====================================
  // 21. 처음 실행
  // =====================================

  window.addEventListener("resize", () => {
    resizeCanvas();
    createStars();
  });

  resizeCanvas();
  createStars();

  requestAnimationFrame((timestamp) => {
    lastTime = timestamp;
    gameLoop(timestamp);
  });

</script>

</body>
</html>
