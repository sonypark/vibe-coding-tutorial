
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 게임 놀이터</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px 16px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #fce7f3);
      color: #263247;
    }

    .container {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 35px 10px;
    }

    header .emoji { font-size: 55px; }

    header h1 {
      margin: 12px 0;
      font-size: clamp(28px, 6vw, 42px);
    }

    header p {
      color: #64748b;
      font-size: 16px;
      line-height: 1.6;
    }

    .game-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .game-card {
      background: white;
      border-radius: 22px;
      padding: 25px 18px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.13);
    }

    .game-icon {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    .mole-bg { background: #fef3c7; }
    .memory-bg { background: #fce7f3; }
    .meteor-bg { background: #dbeafe; }
    .new-bg { background: #dcfce7; }

    .game-card h2 {
      font-size: 21px;
      margin: 10px 0;
    }

    .game-card p {
      min-height: 48px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
    }

    .play-btn {
      display: block;
      margin-top: 20px;
      padding: 13px 10px;
      border-radius: 13px;
      background: #4f7df3;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
    }

    .play-btn:hover { background: #315ed0; }

    footer {
      text-align: center;
      margin-top: 45px;
      color: #64748b;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .game-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 13px;
      }

      .game-card { padding: 20px 12px; }

      .game-icon {
        width: 75px;
        height: 75px;
        font-size: 40px;
      }
    }

    @media (max-width: 360px) {
      .game-list { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="emoji">🎮</div>
      <h1>나의 게임 놀이터</h1>
      <p>
        재미있는 게임을 골라서 플레이해 보세요!<br>
        앞으로 새로운 게임도 계속 추가할 예정이에요.
      </p>
    </header>

    <main class="game-list">
      <!-- 게임 1: game1.html -->
      <article class="game-card">
        <div class="game-icon mole-bg">🐹</div>
        <h2>두더지 잡기</h2>
        <p>
          나타나는 두더지를 빠르게 터치하세요!<br>
          제한 시간 안에 높은 점수에 도전해요.
        </p>
        <a href="./game1.html" class="play-btn">게임 시작하기 →</a>
      </article>

      <!-- 게임 2: game2.html -->
      <article class="game-card">
        <div class="game-icon memory-bg">🧠</div>
        <h2>같은 그림 찾기</h2>
        <p>
          카드를 뒤집어 같은 그림을 찾아보세요.<br>
          기억력 테스트에 도전해요!
        </p>
        <a href="./game2.html" class="play-btn">게임 시작하기 →</a>
      </article>

      <!-- 게임 3: game3.html -->
      <article class="game-card">
        <div class="game-icon meteor-bg">🚀</div>
        <h2>운석 피하기</h2>
        <p>
          우주선을 움직여 운석을 피하세요.<br>
          최대한 오래 살아남아 보세요!
        </p>
        <a href="./game3.html" class="play-btn">게임 시작하기 →</a>
      </article>

      <!-- 새 게임을 추가할 때 이 game-card를 복사해 사용하세요. -->
      <!--
      <article class="game-card">
        <div class="game-icon new-bg">🧩</div>
        <h2>새 게임 이름</h2>
        <p>게임 설명을 여기에 적어주세요.</p>
        <a href="./newgame.html" class="play-btn">게임 시작하기 →</a>
      </article>
      -->
    </main>

    <footer>
      <p>✨ My Game Playground ✨</p>
    </footer>
  </div>
</body>
</html>
